<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Component</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .card {
            width: 300px;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }

        .card img {
            width: 100%;
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card h2 {
            color: #333;
        }

        .card p {
            color: #666;
        }

        .card button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://placehold.co/300x180" alt="Sample card image">

        <div class="card-content">
            <h2>My Card</h2>

            <p>This is a beautiful CSS card component.</p>

            <button>Learn More</button>
        </div>

    </div>

</body>
</html>
