<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Column Footer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 40px 20px;
        }

        .footer-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .footer-column h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .footer-column p {
            color: #ccc;
            line-height: 1.6;
        }

        .footer-column a {
            display: block;
            color: #ccc;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .footer-column a:hover {
            color: white;
        }

        .copyright {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #444;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .footer-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <footer>
        <div class="footer-container">

            <div class="footer-column">
                <h3>About Us</h3>
                <p>We create beautiful and responsive websites using HTML and CSS.</p>
            </div>

            <div class="footer-column">
                <h3>Quick Links</h3>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Projects</a>
                <a href="#">Contact</a>
            </div>

            <div class="footer-column">
                <h3>Contact</h3>
                <p>Email: hello@example.com</p>
                <p>Phone: +254 700 000 000</p>
            </div>

        </div>

        <div class="copyright">
            <p>&copy; 2026 My Website. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
