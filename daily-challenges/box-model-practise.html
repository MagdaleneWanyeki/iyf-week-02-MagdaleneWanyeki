<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model Practice</title>

    <style>
/* 1. Reset  */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


        /* Exercise 2: Debug the Layout */

.broken-box {
    width: 300px;
    padding: 20px;
    border: 10px solid black;
    box-sizing: border-box;
    background-color: lightgreen;
}
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .box {
            width: 200px;
            padding: 20px;
            border: 5px solid blue;
            margin: 20px;
            background-color: lightblue;
        }

        .box2 {
            width: 200px;
            padding: 20px;
            border: 5px solid green;
            margin: 20px;
            background-color: lightgreen;
        }

        .box3 {
            width: 200px;
            padding: 20px;
            border: 5px solid red;
            margin: 20px;
            background-color: pink;
        }

        .box4 {
            width: 200px;
            padding: 20px;
            border: 5px solid orange;
            margin: 20px;
            background-color: lightyellow;
        }
/* Exercise 3: Card Component */

.card {
    width: 300px;
    padding: 20px;
    border: 1px solid gray;
    box-sizing: border-box;
    margin: 20px auto;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.card img {
    width: 100%;
    display: block;
}

.card h3 {
    color: #333;
}

.card p {
    color: #666;
}
    </style>
</head>

<body>

    <h1>CSS Box Model Practice</h1>

    <div class="box">Box 1</div>
    <div class="box2">Box 2</div>
    <div class="box3">Box 3</div>
    <div class="box4">Box 4</div>

    <h2>Exercise 2: Debug the Layout</h2>

<div class="broken-box">
    This box should be exactly 300px wide.
</div>

<h2>Exercise 3: Card Component</h2>

<div class="card">
    <img src="https://placehold.co/260x150" alt="Sample image">

    <h3>My CSS Card</h3>

    <p>This card demonstrates the CSS Box Model.</p>
</div>

</body>
</html>
